<!doctype html>
<html lang="es" data-theme="light">
<head>
  <meta charset="utf-8">
  <title>Nexo · Gestión empresarial</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Schibsted+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
  <!-- Aplica el tema guardado antes de pintar, para que no parpadee al cargar -->
  <script>
    try {
      var tema = localStorage.getItem('nexo-tema');
      if (tema === 'dark' || tema === 'light') document.documentElement.dataset.theme = tema;
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
